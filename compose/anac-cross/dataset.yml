root: "../../out"
schema_version: 1

dataset:
  name: "anac_cross"
  source_id: "dataciviclab_composite"
  tags: [appalti, anac, compose, cross]
  category: appalti
  description: "Compose ANAC: CIG-level snapshot unificato (2026) da tutti i dataset ANAC + vista lifecycle (bandi 2007-2026 + snapshot)."
  years: [2026]
  time_coverage:
    mode: snapshot

# Compose **mart-only** (modello pil-intelligence / legal-graph): niente raw,
# niente clean. Ogni mart legge i support di cui ha bisogno. Il vecchio clean
# CIG-level (11 join, 11,6M righe) serviva solo a mart_lifecycle, che non aveva
# consumatori ed e' stato rimosso.

support:
  - type: dataset
    name: aggiudicatari
    config: ../../datasets/anac-aggiudicatari/dataset.yml
    years: [2026]
  - type: dataset
    name: partecipanti
    config: ../../datasets/anac-partecipanti/dataset.yml
    years: [2026]
  - type: dataset
    name: subappalti
    config: ../../datasets/anac-subappalti/dataset.yml
    years: [2026]
  - type: dataset
    name: stati_avanzamento
    config: ../../datasets/anac-stati-avanzamento/dataset.yml
    years: [2026]
  - type: dataset
    name: collaudo
    config: ../../datasets/anac-collaudo/dataset.yml
    years: [2026]
  - type: dataset
    name: cup
    config: ../../datasets/anac-cup/dataset.yml
    years: [2026]
  - type: dataset
    name: avvio_contratto
    config: ../../datasets/anac-avvio-contratto/dataset.yml
    years: [2026]
  - type: dataset
    name: fine_contratto
    config: ../../datasets/anac-fine-contratto/dataset.yml
    years: [2026]
  - type: dataset
    name: sospensioni
    config: ../../datasets/anac-sospensioni/dataset.yml
    years: [2026]
  - type: dataset
    name: varianti
    config: ../../datasets/anac-varianti/dataset.yml
    years: [2026]
  - type: dataset
    name: bandi_gara
    config: ../../datasets/anac-bandi-gara/dataset.yml
    years: [2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  # aggiudicazioni è anche il raw source primario del compose: qui serve
  # come support per i mart che leggono i campi originali (importo,
  # offerte, ribassi).
  - type: dataset
    name: aggiudicazioni
    config: ../../datasets/anac-aggiudicazioni/dataset.yml
    years: [2026]


mart:
  tables:
    - name: "mart_panoramica"
      sql: "sql/mart_panoramica.sql"
    - name: "mart_imprese"
      sql: "sql/mart_imprese.sql"
    - name: "mart_ritardi_per_sa"
      sql: "sql/mart_ritardi_per_sa.sql"
    - name: "mart_competitivita"
      sql: "sql/mart_competitivita.sql"
    - name: "mart_esecuzione"
      sql: "sql/mart_esecuzione.sql"
    - name: "mart_ritardi_contratto"
      sql: "sql/mart_ritardi_contratto.sql"
    - name: "mart_collaudo_ritardo"
      sql: "sql/mart_collaudo_ritardo.sql"
  required_tables:
    - mart_panoramica
    - mart_imprese
    - mart_ritardi_per_sa
    - mart_competitivita
    - mart_esecuzione
    - mart_ritardi_contratto
    - mart_collaudo_ritardo
  validate:
    table_rules:
      mart_panoramica:
        min_rows: 10
      mart_imprese:
        min_rows: 100000
      mart_ritardi_per_sa:
        min_rows: 100
      mart_competitivita:
        min_rows: 100
      mart_esecuzione:
        min_rows: 10
      mart_ritardi_contratto:
        min_rows: 10
      mart_collaudo_ritardo:
        min_rows: 10

duckdb:
  # 8GB su una macchina da 7,9GB faceva andare il sistema in paging.
  memory_limit: "5GB"

validation:
  fail_on_error: true

output:
  artifacts: "standard"
