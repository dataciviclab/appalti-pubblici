root: "../../out"
schema_version: 1

dataset:
  name: "anac_cross"
  source_id: "dataciviclab_composite"
  tags: [appalti, anac, compose, cross]
  category: appalti
  description: "Compose ANAC: CIG-level snapshot unificato (2026) da tutti i dataset ANAC + vista lifecycle (bandi 2016-2025 + snapshot)."
  years: [2026]
  time_coverage:
    mode: snapshot

# Compose: clean unifica tutti i dataset ANAC a livello CIG (2026).
# I mart derivano viste aggregate dal clean unificato.
# Eseguire prima: toolkit run per tutti i dataset singoli in datasets/.

raw:
  output_policy: overwrite
  sources:
    - name: "aggiudicazioni"
      type: local_file
      args:
        path: "../../out/data/clean/anac_aggiudicazioni/2026/anac_aggiudicazioni_2026_clean.parquet"
        filename: "aggiudicazioni.parquet"
      primary: true

support:
  - type: dataset
    name: aggiudicatari
    config: ../../datasets/anac-aggiudicatari/dataset.yml
    years: [2026]
  - type: dataset
    name: partecipanti
    config: ../../datasets/anac-partecipanti/dataset.yml
    years: [2026]
  - type: dataset
    name: subappalti
    config: ../../datasets/anac-subappalti/dataset.yml
    years: [2026]
  - type: dataset
    name: stati_avanzamento
    config: ../../datasets/anac-stati-avanzamento/dataset.yml
    years: [2026]
  - type: dataset
    name: collaudo
    config: ../../datasets/anac-collaudo/dataset.yml
    years: [2026]
  - type: dataset
    name: cup
    config: ../../datasets/anac-cup/dataset.yml
    years: [2026]
  - type: dataset
    name: avvio_contratto
    config: ../../datasets/anac-avvio-contratto/dataset.yml
    years: [2026]
  - type: dataset
    name: fine_contratto
    config: ../../datasets/anac-fine-contratto/dataset.yml
    years: [2026]
  - type: dataset
    name: sospensioni
    config: ../../datasets/anac-sospensioni/dataset.yml
    years: [2026]
  - type: dataset
    name: varianti
    config: ../../datasets/anac-varianti/dataset.yml
    years: [2026]
  - type: dataset
    name: bandi_gara
    config: ../../datasets/anac-bandi-gara/dataset.yml
    years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  # aggiudicazioni è anche il raw source primario del compose: qui serve
  # come support per i mart che leggono i campi originali (importo,
  # offerte, ribassi).
  - type: dataset
    name: aggiudicazioni
    config: ../../datasets/anac-aggiudicazioni/dataset.yml
    years: [2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  required_columns:
    - "cig"
    - "n_aggiudicazioni"
    - "importo_totale_agg"
    - "n_aggiudicatari"
    - "n_partecipanti"
    - "n_subappalti"
    - "n_sal"
    - "importo_totale_sal"
    - "n_serie_sal"
    - "n_serie_anomale"
    - "cup"
    - "n_cup"
    - "cups"
    - "data_stipula_contratto"
    - "data_effettiva_ultimazione"
    - "giorni_scostamento_termine"
    - "n_sospensioni"
    - "n_varianti"
  validate:
    not_null:
      - "cig"
    min_rows: 1

mart:
  tables:
    - name: "mart_panoramica"
      sql: "sql/mart_panoramica.sql"
    - name: "mart_lifecycle"
      sql: "sql/mart_lifecycle.sql"
    - name: "mart_imprese"
      sql: "sql/mart_imprese.sql"
    - name: "mart_ritardi_per_sa"
      sql: "sql/mart_ritardi_per_sa.sql"
    - name: "mart_competitivita"
      sql: "sql/mart_competitivita.sql"
    - name: "mart_esecuzione"
      sql: "sql/mart_esecuzione.sql"
    - name: "mart_ritardi_contratto"
      sql: "sql/mart_ritardi_contratto.sql"
  required_tables:
    - mart_panoramica
    - mart_lifecycle
    - mart_imprese
    - mart_ritardi_per_sa
    - mart_competitivita
    - mart_esecuzione
    - mart_ritardi_contratto
  validate:
    table_rules:
      mart_panoramica:
        min_rows: 10
      mart_lifecycle:
        min_rows: 100000
      mart_imprese:
        min_rows: 100000
      mart_ritardi_per_sa:
        min_rows: 100
      mart_competitivita:
        min_rows: 100
      mart_esecuzione:
        min_rows: 10
      mart_ritardi_contratto:
        min_rows: 10

duckdb:
  memory_limit: "8GB"

validation:
  fail_on_error: true

output:
  artifacts: "standard"
