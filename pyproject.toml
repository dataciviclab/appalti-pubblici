[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-appalti-pubblici"
version = "0.1.0"
description = "Appalti pubblici italiani — dati bandi e contratti"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.3,<2",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]
# Catalog engine per-repo (probe, inventory, source report).
observatory = [
    "dataciviclab-source-observatory[validate] @ git+https://github.com/dataciviclab/source-observatory.git@main",
]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/appalti-pubblici"

[tool.toolkit.extends]
source_id = "appalti-pubblici"

[tool.observatory]
source_id = "anac"
protocol = "ckan"
base_url = "https://dati.anticorruzione.it/opendata/api/3/action/package_list"
observation_mode = "catalog-watch"
verdict = "go"
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
note = "CKAN diretto ANAC (dati.anticorruzione.it, 70 package) — diverso dall'aggregato dati.gov.it monitorato in SO centrale. WAF richiede User-Agent browser. toolkit.extends dichiara 'appalti-pubblici', i dataset.yml usano 'anac'."
