[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-appalti-pubblici"
version = "0.1.0"
description = "Appalti pubblici italiani — dati bandi e contratti"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.3,<2",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/appalti-pubblici"

[tool.toolkit.extends]
source_id = "appalti-pubblici"
