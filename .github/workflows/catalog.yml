name: Catalog

on:
  schedule:
    - cron: "10 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"

concurrency:
  group: appalti-pubblici-catalog-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  catalog:
    permissions:
      contents: write
      pull-requests: write
    uses: dataciviclab/.github/.github/workflows/catalog-reusable.yml@main
    with:
      repo-slug: appalti-pubblici
      catalog-args: "--workers 4"
      dry-run: ${{ github.event_name == 'pull_request' }}
