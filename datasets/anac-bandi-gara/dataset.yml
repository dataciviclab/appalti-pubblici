root: "../../out"
schema_version: 1

dataset:
  name: "anac_bandi_gara"
  source_id: "anac"
  tags: [appalti, anac, bandi, gara]
  category: appalti
  years: [2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  # Copertura dichiarata: senza, il period editoriale del registry v1
  # (2016-2025, poi corretto a mano) vince sulla serie reale configurata.
  time_coverage:
    start_year: 2007
    end_year: 2026

raw:
  # overwrite: il default 'versioned' scrive <file>_1.csv e il clean con
  # mode: all legge anche quello (lettura doppia, e righe doppie dove il clean
  # non deduplica).
  output_policy: overwrite
  sources:
    - name: "cig_{year}"
      type: "ckan"
      # optional: `cig-2026` non esiste (i pacchetti annuali si fermano al 2025);
      # il 2026 arriva dalla sorgente cig_delta qui sotto.
      optional: true
      client:
        user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      args:
        portal_url: "https://dati.anticorruzione.it/opendata"
        dataset_id: "cig-{year}"
        download_all: true
      primary: true
    - name: "cig_delta"
      type: "ckan"
      # Dataset `cig`: delta mensili (dal 2023) con le variazioni su qualunque
      # anno. Qui serve solo per il 2026: le righe pre-2026 sono correzioni di
      # stato che non cambiano importi/oggetti (misurato: 0,2%).
      year: 2026
      client:
        user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      args:
        portal_url: "https://dati.anticorruzione.it/opendata"
        dataset_id: "cig"
        download_all: true
      primary: false

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: all
    header: true
    delim: ";"
    encoding: "utf-8"
    quote: '"'
    escape: '"'
    null_padding: true
    trim_whitespace: true
    sample_size: -1
  # Solo il 2026 (delta `cig`) ha bisogno di una lettura diversa: virgolette
  # escapate male e newline dentro i campi. Gli anni 2007-2025 sono CSV puliti
  # e restano in lettura parallela (~3x piu' veloce).
  read_by_year:
    2026:
      strict_mode: false
      parallel: false
  required_columns:
    - "cig"
    - "anno_pubblicazione"
    - "importo_lotto"
    - "stato"
  validate:
    # Chiave del Manuale ANAC v1.4 §4 (pag. 16): per i pacchetti annuali `cig-AAAA`
    # la chiave e' `Cig`. Il clean deduplica gia' per CIG sulla comunicazione piu'
    # recente; qui la dichiariamo, cosi' una regressione del dedup si vede.
    primary_key:
      - "cig"
    not_null:
      - "cig"
    min_rows: 1

mart:
  tables:
    - name: "mart_annuale"
      sql: "sql/mart.sql"
    - name: "mart_trend_pnrr"
      sql: "sql/mart_trend_pnrr.sql"
    - name: "mart_top_stazioni"
      sql: "sql/mart_top_stazioni.sql"
    - name: "mart_esiti_per_procedura"
      sql: "sql/mart_esiti_per_procedura.sql"
    - name: "mart_trend_settore"
      sql: "sql/mart_trend_settore.sql"
    - name: "mart_sa_profilo"
      sql: "sql/mart_sa_profilo.sql"
  required_tables:
    - "mart_annuale"
    - "mart_trend_pnrr"
    - "mart_sa_profilo"
  validate:
    table_rules:
      mart_trend_pnrr:
        min_rows: 10
      mart_sa_profilo:
        min_rows: 100

validation:
  fail_on_error: true

output:
  artifacts: "standard"
