root: "../../out"
schema_version: 1

dataset:
  name: "anac_collaudo"
  source_id: "anac"
  tags: [appalti, anac, collaudo]
  category: appalti
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2026

raw:
  # overwrite: con split_resources il default "versioned" accumulerebbe
  # 00-..., 00-..._1, ... a ogni run.
  output_policy: overwrite
  sources:
    - name: "collaudo"
      type: "ckan"
      extractor:
        type: "unzip_all"
        args:
          only_ext: [".csv"]
      client:
        user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      args:
        portal_url: "https://dati.anticorruzione.it/opendata"
        dataset_id: "collaudo"
        # Il full non e' cumulativo: fermo al 2026-01-15, gli aggiornamenti
        # arrivano solo nei delta mensili `YYYYMMDD-<dataset>_csv`.
        # split_resources: un file per risorsa, ordinato per last_modified.
        download_all: true
        split_resources: true
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - "cig"
    - "id_aggiudicazione"
  read:
    source: config_only
    mode: all
    header: true
    delim: ";"
    encoding: "utf-8"
    quote: '"'
    escape: '"'
    null_padding: true
    trim_whitespace: true
    source_file: true
    sample_size: -1
  validate:
    primary_key:
      - "cig"
      - "id_aggiudicazione"
    not_null:
      - "cig"
      - "id_aggiudicazione"
    min_rows: 1

mart:
  tables:
    - name: "mart_collaudo"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_collaudo"
  validate:
    table_rules:
      mart_collaudo:
        min_rows: 1

validation:
  fail_on_error: true

output:
  artifacts: "standard"
